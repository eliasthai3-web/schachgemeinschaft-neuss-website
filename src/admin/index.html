<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Admin-Bereich deaktiviert | Schachgemeinschaft Neuss e.V.</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fbfc;
      --surface: #ffffff;
      --text: #10252b;
      --muted: #536970;
      --line: #bfd5dc;
      --gold: #edcd58;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100%, 720px);
      padding: 2rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 4px solid var(--gold);
      border-radius: 4px;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      line-height: 1.15;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Admin-Bereich deaktiviert</h1>
    <p>
      Der Admin-Bereich ist aktuell deaktiviert. Änderungen und neue Meldungen im Bereich Aktuelles werden vorerst über GitHub/Codex gepflegt und danach automatisch per GitHub Actions auf die Website hochgeladen.
    </p>
  </main>
</body>
</html>
